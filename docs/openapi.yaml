openapi: 3.1.1
info:
  title: Castalia Mermaid Validator
  version: 0.1.0
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
  description: |
    HTTP API v1 for standalone, stateless validation of raw Mermaid syntax using
    official mermaid.parse() with jsdom. v1 is a contract name, not a URL prefix.
    No rendering, SVG, Markdown extraction, accounts, persistent storage or
    external browser. Source is never echoed in responses. There are exactly two
    routes, with no trailing-slash aliases or health/documentation endpoints.

    No authentication or CORS headers are added by default. Expose through a
    trusted proxy where access control or rate limiting is needed; no proxy
    authentication mechanism or production URL is specified here. Query strings
    are ignored for routing and are never Mermaid configuration. There are no
    supported query, path or cookie parameters, configuration or timeout options.

    Fixed inclusive limits: the entire HTTP body, including JSON overhead, is at
    most 131072 bytes; decoded source is at most 50000 UTF-16 code units AND
    100000 UTF-8 bytes. The body-byte limit is enforced while reading, including
    streaming requests without Content-Length; that header is not trusted.
    Exceeding any limit gives 413 PAYLOAD_TOO_LARGE. These units are not JSON
    Schema character counts; descriptions and x-extensions retain runtime rules.

    Validation has a 5000 ms deadline including engine startup, imports and parse
    (not an HTTP-body upload deadline). At most 2 validations are active per
    process, with no unbounded queue: extra work gives 503 BUSY. Deadline expiry
    gives 504 VALIDATION_TIMEOUT and terminates actual isolated work so it no
    longer occupies capacity. Runtime/import/DOM/worker failures give 500, never
    200 valid:false. No client-controlled Mermaid configuration is accepted;
    source directives/frontmatter must not weaken secure settings or contaminate
    subsequent requests. No diagram-provided resource fetch, rendering, jsdom
    scripts or subresource loading is required or enabled.

    Dispatcher behavior outside the two POST operations: unknown path (including
    trailing slash) gives 404 NOT_FOUND; known path with any method other than
    POST gives 405 METHOD_NOT_ALLOWED and Allow: POST. Components NotFound and
    MethodNotAllowed document these responses without inventing operations for
    unknown paths or unsupported methods. HEAD may omit the body while retaining
    corresponding status and headers. No default or catch-all route is implied.

    Precedence: unknown path 404, method 405, media/encoding 415, body-byte limit,
    UTF-8/JSON, object shape/type, source emptiness, source limits, then admission
    and validation. An oversized body need not be parsed. All application-handler
    responses use Content-Type: application/json; charset=utf-8 and Cache-Control:
    no-store. This does not specify errors generated by a proxy or the transport
    outside the application handler. Container readiness can use a small valid
    POST; no health route is required.
servers:
  - url: /
    description: Relative to the deployed service; no public deployment URL is specified.
security: []
tags:
  - name: validation
    description: Raw Mermaid syntax validation without rendering.
paths:
  /validate:
    post:
      operationId: validate
      tags: [validation]
      summary: Validate syntax with a boolean-only result
      description: |
        Both valid and syntactically invalid Mermaid return HTTP 200. The JSON
        object contains exactly valid, never error, position, diagramType, timing
        or echoed source. It is not a bare boolean. Transport/input/service errors
        instead use ServiceError, shared with the detailed operation.
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        $ref: '#/components/requestBodies/Validation'
      responses:
        '200':
          description: Syntax validation completed, whether valid or invalid. UTF-8 JSON.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanValidationResult'
              examples:
                valid:
                  value: {valid: true}
                invalid:
                  value: {valid: false}
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/ValidationTimeout'
  /validate/detailed:
    post:
      operationId: validateDetailed
      tags: [validation]
      summary: Validate syntax and return the first diagnostic when invalid
      description: |
        Both valid and syntactically invalid Mermaid return HTTP 200, with exactly
        valid and error. Only the first syntax error is returned. Coordinates are
        optional knowledge, not guaranteed for every grammar; see SourcePosition
        for original-source attribution. Current mapping conservatively returns
        column:null, with a verified line for some flowchart/graph/sequence errors.
        Positive columns are a permitted contract shape, not a promise that this
        implementation can produce them. Diagnostic examples below are illustrative
        placeholders, not captured parser output or stable message strings.
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        $ref: '#/components/requestBodies/Validation'
      responses:
        '200':
          description: Syntax validation completed, whether valid or invalid. UTF-8 JSON.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedValidationResult'
              examples:
                valid:
                  value: {valid: true, error: null}
                invalid:
                  summary: Illustrative diagnostic; not captured engine output
                  value:
                    valid: false
                    error:
                      message: Mermaid parser diagnostic
                      position: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/ValidationTimeout'
components:
  parameters:
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      description: |
        Absent or identity only, case-insensitive after trimming whitespace.
        Other encodings (including compression) give 415 UNSUPPORTED_MEDIA_TYPE.
      schema:
        type: string
        pattern: '^\s*[iI][dD][eE][nN][tT][iI][tT][yY]\s*$'
      example: identity
  headers:
    NoStore:
      description: Present on all application-handler responses.
      required: true
      schema:
        type: string
        const: no-store
  requestBodies:
    Validation:
      required: true
      description: |
        UTF-8 JSON object with exactly one own property, source. Content-Type must
        be application/json (case-insensitive), optionally with charset=utf-8
        (also case-insensitive; quoted UTF-8 is accepted). Other media parameters,
        missing/wrong Content-Type or unsupported Content-Encoding give 415.
        Missing/zero-byte body, malformed JSON or invalid UTF-8 give INVALID_JSON;
        valid JSON null, arrays, primitives (including JSON empty string), missing
        or extra keys and non-string source give INVALID_INPUT. Object validation
        is performed after JSON decoding. The 131072-byte body limit includes JSON
        overhead; it is independent of the decoded source limits.
      x-max-body-bytes: 131072
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationRequest'
          examples:
            flowchart:
              value:
                source: "flowchart TD\n  A --> B"
            invalidSyntax:
              summary: Valid request schema; invalid Mermaid syntax still returns HTTP 200
              value:
                source: not-a-mermaid-diagram
  schemas:
    ValidationRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          minLength: 1
          description: |
            Raw Mermaid source, not a Markdown document. Empty or whitespace-only
            according to JavaScript String.trim() gives 400 INVALID_INPUT. The
            trim check only determines emptiness: never trim, normalize line
            endings or otherwise mutate the text sent to the parser; Markdown
            fences are not stripped. At most 50000 UTF-16 code units AND 100000
            UTF-8 bytes, inclusive; either excess gives 413 PAYLOAD_TOO_LARGE.
            JSON Schema maxLength is deliberately not substituted for these units;
            x-extensions are annotations and require runtime enforcement.
          x-max-utf16-code-units: 50000
          x-max-utf8-bytes: 100000
          x-nonempty-after-js-trim: true
    BooleanValidationResult:
      type: object
      additionalProperties: false
      required: [valid]
      properties:
        valid:
          type: boolean
    DetailedValidationResult:
      description: Exactly valid and error, with mutually exclusive valid/invalid variants.
      oneOf:
        - type: object
          additionalProperties: false
          required: [valid, error]
          properties:
            valid:
              type: boolean
              const: true
            error:
              type: 'null'
        - type: object
          additionalProperties: false
          required: [valid, error]
          properties:
            valid:
              type: boolean
              const: false
            error:
              $ref: '#/components/schemas/SyntaxDiagnostic'
    SyntaxDiagnostic:
      type: object
      additionalProperties: false
      required: [message, position]
      description: |
        First syntax error only, not a collection of every error. Never expose
        stack traces, filesystem paths, worker/runtime exceptions or arbitrary
        serialized exception objects. Messages can contain untrusted source
        excerpts; consumers must HTML-escape them. Do not log source by default.
      properties:
        message:
          type: string
          minLength: 1
          description: |
            Human-readable parser message, at most 2000 UTF-16 code units. Exact
            text is not stable across Mermaid versions. This is not a JSON Schema
            maxLength character limit. Examples are placeholders, not captured output.
          x-max-utf16-code-units: 2000
        position:
          $ref: '#/components/schemas/SourcePosition'
    SourcePosition:
      description: |
        Null when no trustworthy original-source line is known; otherwise exactly
        line and column. line is a positive 1-based line in original decoded source;
        column is a positive 1-based UTF-16 code-unit column, or null if only the
        line is trustworthy. Do not fabricate (1,1), zero/negative coordinates,
        string placeholders, stack-trace positions or pretty-printed caret columns.
        CRLF is one line break; bare CR and LF each count as one break. EOF after
        a final newline can refer to the following empty line only when verified
        as attributable to the original source. Normalize parser coordinate bases
        only when verified for that parser. Mermaid preprocessing can remove
        directives/frontmatter, comments and empty lines: transformed-source
        coordinates are not original-source coordinates without a verified mapping.
        Use null if mapping is unverified; keep line with column:null if only line
        is reliable. Not all grammars provide coordinates; unknown diagram types
        and coordinate-less diagnostics may have null. Positive-column examples
        illustrate the allowed shape, not current engine coordinate coverage.
      oneOf:
        - type: 'null'
        - type: object
          additionalProperties: false
          required: [line, column]
          properties:
            line:
              type: integer
              minimum: 1
            column:
              type: [integer, 'null']
              minimum: 1
      examples:
        - null
        - {line: 2, column: 3}
        - {line: 2, column: null}
    ServiceError:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        Common transport/input/service failure envelope on both routes, never
        valid or position. HTTP status and code are stable machine interfaces;
        safe nonempty message text is not. Unexpected failures must not leak their
        original exception message or be misreported as Mermaid syntax errors.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_JSON, INVALID_INPUT, NOT_FOUND, METHOD_NOT_ALLOWED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR, BUSY, VALIDATION_TIMEOUT]
            message:
              type: string
              minLength: 1
  responses:
    BadRequest:
      description: |
        INVALID_JSON for absent/empty body, malformed JSON or invalid UTF-8;
        INVALID_INPUT for wrong shape/type or empty/JS-trim-whitespace-only source.
        UTF-8 JSON. Example messages are illustrative, not stable interface text.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ServiceError'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [INVALID_JSON, INVALID_INPUT]
          examples:
            invalidJson:
              value: {error: {code: INVALID_JSON, message: Body must be valid UTF-8 JSON.}}
            invalidInput:
              value: {error: {code: INVALID_INPUT, message: source must be a nonempty string.}}
    NotFound:
      description: |
        Dispatcher-only 404 for an unknown path, including trailing slashes. Not
        a response branch of either correctly addressed POST operation. UTF-8 JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ServiceError'
              - properties:
                  error:
                    properties:
                      code:
                        const: NOT_FOUND
          example: {error: {code: NOT_FOUND, message: Route not found.}}
    MethodNotAllowed:
      description: |
        Dispatcher-only 405 for a known path with a method other than POST. Not
        a branch of a correctly addressed POST. HEAD may omit body. UTF-8 JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Allow:
          required: true
          description: Only POST is supported on either known path.
          schema:
            type: string
            const: POST
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ServiceError'
              - properties:
                  error:
                    properties:
                      code:
                        const: METHOD_NOT_ALLOWED
          example: {error: {code: METHOD_NOT_ALLOWED, message: Only POST is supported.}}
    PayloadTooLarge:
      description: Body or decoded source exceeds any inclusive size limit. UTF-8 JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ServiceError'
              - properties:
                  error:
                    properties:
                      code:
                        const: PAYLOAD_TOO_LARGE
          example: {error: {code: PAYLOAD_TOO_LARGE, message: Request exceeds the validation size limit.}}
    UnsupportedMediaType:
      description: Missing/wrong Content-Type or unsupported Content-Encoding. UTF-8 JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ServiceError'
              - properties:
                  error:
                    properties:
                      code:
                        const: UNSUPPORTED_MEDIA_TYPE
          example: {error: {code: UNSUPPORTED_MEDIA_TYPE, message: Use application/json and identity content encoding.}}
    InternalError:
      description: Unexpected engine/runtime/service failure without original exception details. UTF-8 JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ServiceError'
              - properties:
                  error:
                    properties:
                      code:
                        const: INTERNAL_ERROR
          example: {error: {code: INTERNAL_ERROR, message: Validation service failed.}}
    Busy:
      description: Per-process capacity of 2 active validations exhausted; no unbounded queue. UTF-8 JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ServiceError'
              - properties:
                  error:
                    properties:
                      code:
                        const: BUSY
          example: {error: {code: BUSY, message: Validation capacity is exhausted.}}
    ValidationTimeout:
      description: Validation deadline of 5000 ms exceeded; actual isolated work terminated. UTF-8 JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ServiceError'
              - properties:
                  error:
                    properties:
                      code:
                        const: VALIDATION_TIMEOUT
          example: {error: {code: VALIDATION_TIMEOUT, message: Validation deadline exceeded.}}
